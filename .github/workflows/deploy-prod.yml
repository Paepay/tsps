name: Deploy prod

# Paepay/tsps only. Never runs against RSPSApp/tsps (or any other fork): the job
# `if` and the assert step both require github.repository == 'Paepay/tsps'.
# Do not remove those guards or point this workflow at the upstream repo.
#
# Behaviour:
#   - push to prod → update the shared checkout + yarn install/build only. Never
#     restarts a live world: running processes keep the previous build.
#   - workflow_dispatch → manual update / restart / both (Actions → Deploy prod → Run).
#     A restart asks the Official world for its five-minute counted restart, which
#     warns, logs out and saves players before systemd starts the replacement.
#     Community worlds (the Level-Up world) are never restarted by this workflow;
#     their owner restarts them from the platform dashboard so they get the same
#     five-minute timer.
#
# Worlds (tsps, paescape-level-up, paescape-official, …) must share WorkingDirectory
# `$VPS_PATH/server` with their own EnvironmentFile. One build updates every world;
# push never restarts them.
#
# Required Actions secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST     Hostname or IP of the VPS
#   VPS_USER     SSH login user
#   VPS_SSH_KEY_B64  Private ed25519 key, base64-encoded (no passphrase).
#                    Prefer this over VPS_SSH_KEY — multiline PEM secrets often break.
#   VPS_SSH_KEY      Fallback: raw private key PEM (avoid if possible)
#   VPS_PATH         Absolute checkout path, e.g. /home/user/apps/tsps
#   VPS_SERVICE      optional, retained for older deployments; no longer restarted.
#
# One-time VPS setup:
#   1. Generate a keypair for Actions; add the public key to ~/.ssh/authorized_keys
#      for VPS_USER. Store the private key as VPS_SSH_KEY.
#   2. Install a user unit (~/.config/systemd/user/<name>.service) with an absolute
#      yarn/node PATH (nvm is not on systemd's default PATH). Enable linger so it
#      survives logout: loginctl enable-linger "$USER"
#   3. Ensure the checkout at VPS_PATH can `git fetch origin prod` (GitHub deploy key
#      or personal SSH key with repo read access).
#   4. First checkout / branch (once):
#        cd "$VPS_PATH" && git fetch origin prod && git checkout -B prod origin/prod
on:
    push:
        branches: [prod]
    workflow_dispatch:
        inputs:
            mode:
                description: Update code, request the five-minute restart, or both
                type: choice
                options:
                    - update
                    - restart
                    - update-and-restart
                default: update

permissions:
    contents: read

concurrency:
    group: deploy-prod
    cancel-in-progress: false

jobs:
    deploy:
        # Skip entirely on RSPSApp/tsps and every other repository.
        if: github.repository == 'Paepay/tsps' && (github.event_name != 'push' || github.ref == 'refs/heads/prod')
        runs-on: ubuntu-latest
        steps:
            - name: Require Paepay/tsps
              run: |
                  set -eu
                  if [ "${{ github.repository }}" != Paepay/tsps ]; then
                      echo "Refusing to deploy: repository is ${{ github.repository }}, not Paepay/tsps" >&2
                      exit 1
                  fi

            - name: Decide update vs restart
              id: plan
              run: |
                  set -eu
                  event="${{ github.event_name }}"
                  mode="${{ github.event.inputs.mode || '' }}"

                  if [ "$event" = workflow_dispatch ]; then
                      case "$mode" in
                          update)
                              echo "do_update=true" >> "$GITHUB_OUTPUT"
                              echo "do_restart=false" >> "$GITHUB_OUTPUT"
                              ;;
                          restart)
                              echo "do_update=false" >> "$GITHUB_OUTPUT"
                              echo "do_restart=true" >> "$GITHUB_OUTPUT"
                              ;;
                          update-and-restart)
                              echo "do_update=true" >> "$GITHUB_OUTPUT"
                              echo "do_restart=true" >> "$GITHUB_OUTPUT"
                              ;;
                          *)
                              echo "Unknown mode: $mode" >&2
                              exit 1
                              ;;
                      esac
                      echo "deploy_sha=" >> "$GITHUB_OUTPUT"
                      echo "run=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  # push to prod: ship code only; a counted restart picks it up later
                  echo "do_update=true" >> "$GITHUB_OUTPUT"
                  echo "do_restart=false" >> "$GITHUB_OUTPUT"
                  echo "deploy_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
                  echo "run=true" >> "$GITHUB_OUTPUT"

            - name: Deploy to VPS over SSH
              if: steps.plan.outputs.run == 'true'
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
                  VPS_PATH: ${{ secrets.VPS_PATH }}
                  DEPLOY_SHA: ${{ steps.plan.outputs.deploy_sha }}
                  DO_UPDATE: ${{ steps.plan.outputs.do_update }}
                  DO_RESTART: ${{ steps.plan.outputs.do_restart }}
              run: |
                  set -eu
                  # Trim copy/paste whitespace from secrets (trailing newlines break SSH).
                  VPS_HOST=$(printf '%s' "$VPS_HOST" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                  VPS_USER=$(printf '%s' "$VPS_USER" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                  VPS_PATH=$(printf '%s' "$VPS_PATH" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                  for required in VPS_HOST VPS_USER VPS_PATH; do
                      eval "value=\${$required:-}"
                      if [ -z "$value" ]; then
                          echo "Missing secret: $required" >&2
                          exit 1
                      fi
                  done
                  if [ -z "${VPS_SSH_KEY_B64:-}" ] && [ -z "${VPS_SSH_KEY:-}" ]; then
                      echo "Missing secret: VPS_SSH_KEY_B64 (or VPS_SSH_KEY)" >&2
                      exit 1
                  fi

                  key_dir=$(mktemp -d)
                  trap 'rm -rf "$key_dir"' EXIT HUP INT TERM
                  if [ -n "${VPS_SSH_KEY_B64:-}" ]; then
                      printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > "$key_dir/key"
                  else
                      printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key_dir/key"
                  fi
                  chmod 600 "$key_dir/key"
                  ssh-keygen -lf "$key_dir/key"
                  ssh-keygen -y -f "$key_dir/key" >/dev/null
                  echo "SSH target user_len=${#VPS_USER} host_len=${#VPS_HOST} path_len=${#VPS_PATH}"
                  case "$VPS_HOST" in
                      *@*) echo "VPS_HOST must be host/IP only, not user@host" >&2; exit 1 ;;
                  esac

                  ssh_options="-i $key_dir/key -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=accept-new"

                  # shellcheck disable=SC2086
                  if ! ssh $ssh_options "$VPS_USER@$VPS_HOST" true; then
                      echo "SSH auth failed for the configured VPS_USER@VPS_HOST with the deploy key above." >&2
                      echo "Local check that should match secrets: ssh -i gha_vps_deploy -o IdentitiesOnly=yes USER@HOST" >&2
                      exit 255
                  fi

                  # shellcheck disable=SC2086
                  ssh $ssh_options "$VPS_USER@$VPS_HOST" \
                      env \
                      DEPLOY_SHA="$DEPLOY_SHA" \
                      VPS_PATH="$VPS_PATH" \
                      DO_UPDATE="$DO_UPDATE" \
                      DO_RESTART="$DO_RESTART" \
                      bash -s <<'REMOTE'
                  set -eu
                  # Non-interactive SSH has no nvm on PATH; load it for yarn/node.
                  export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
                  if [ -s "$NVM_DIR/nvm.sh" ]; then
                      # shellcheck disable=SC1090
                      . "$NVM_DIR/nvm.sh"
                  fi
                  # User systemd needs the runtime dir over SSH (linger must be on).
                  export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"

                  cd "$VPS_PATH"

                  if [ "$DO_UPDATE" = true ]; then
                      git fetch origin prod
                      git checkout prod 2>/dev/null || git checkout -B prod origin/prod
                      if [ -n "${DEPLOY_SHA:-}" ]; then
                          git reset --hard "$DEPLOY_SHA"
                      else
                          git reset --hard origin/prod
                      fi
                      # One shared server tree: every world unit's WorkingDirectory is $VPS_PATH/server.
                      (cd server && corepack enable && yarn install --immutable && yarn build)
                      echo "Updated shared checkout to $(git rev-parse --short HEAD) ($VPS_PATH/server)"
                  fi

                  if [ "$DO_RESTART" = true ]; then
                      # Never signal a live world here. The operator CLI asks the platform
                      # for the fixed five-minute counted restart, so players are warned,
                      # logged out and saved before systemd replaces the process.
                      operator=""
                      if [ -x /usr/local/bin/paescape-official ]; then
                          operator=/usr/local/bin/paescape-official
                      elif [ -x "$VPS_PATH/server/deploy/paescape-official" ]; then
                          operator="$VPS_PATH/server/deploy/paescape-official"
                      fi
                      if [ -z "$operator" ]; then
                          echo "paescape-official was not found; refusing to hard-restart the official world" >&2
                          exit 1
                      fi
                      "$operator" restart
                      echo "Official world five-minute restart requested; community worlds stay untouched until their owner restarts them from the dashboard"
                  else
                      echo "Skipped restart (shared build is on disk; live worlds pick it up on their five-minute counted restart)"
                  fi
                  REMOTE
